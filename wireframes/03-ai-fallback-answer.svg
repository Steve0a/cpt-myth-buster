size="11" fill="#1F1F1F" font-weight="bold">AI ANSWER · FROM OFFICIAL TEXT ONLY</text><rect x="340" y="184" width="720" height="8" rx="4" fill="#DDE3EA"/><rect x="340" y="202" width="720" height="8" rx="4" fill="#DDE3EA"/><rect x="340" y="220" width="680" height="8" rx="4" fill="#DDE3EA"/><rect x="340" y="250" width="760" height="80" rx="16" fill="#F0F4F9"/><rect x="368" y="266" width="700" height="8" rx="4" fill="#C4CBD4"/><rect x="368" y="284" width="660" height="8" rx="4" fill="#C4CBD4"/><rect x="356" y="302" width="110" height="20" rx="10" fill="#D3E3FD"/><text x="364" y="316" font-size="10" fill="#0B57D0" font-weight="bold">QUOTE VERIFIED</text><text x="476" y="317" font-size="12" fill="#0B57D0">USCIS Policy Manual / 8 CFR 214.2(f)(10)</text><rect x="340" y="342" width="760" height="80" rx="16" fill="#F0F4F9"/><rect x="368" y="358" width="700" height="8" rx="4" fill="#C4CBD4"/><rect x="368" y="376" width="660" height="8" rx="4" fill="#C4CBD4"/><rect x="356" y="394" width="110" height="20" rx="10" fill="#D3E3FD"/><text x="364" y="408" font-size="10" fill="#0B57D0" font-weight="bold">QUOTE VERIFIED</text><text x="476" y="409" font-size="12" fill="#0B57D0">USCIS Policy Manual / 8 CFR 214.2(f)(10)</text><text x="340" y="450" font-size="12" fill="#80868B">Written by Gemini using only saved official pages. Quotes checked word for word. Confirm with your DSO.</text><rect x="340" y="480" width="760" height="120" rx="16" fill="#FFFFFF"/><rect x="340" y="480" width="760" height="120" rx="16" fill="none" stroke="#B3261E" stroke-dasharray="6 4"/><text x="360" y="508" font-size="13" fill="#B3261E">Flow: smart search score < 0.70  →  POST /api/ask (Cloudflare Worker)  →  Gemini with official text only</text><text x="360" y="536" font-size="13" fill="#B3261E">→  every quote verified against source text  →  no verified quote = 'No official answer found' + ask your DSO</text><text x="360" y="564" font-size="13" fill="#B3261E">Off-topic questions (weather, green card, B-2 visits) are refused.</text><rect x="400" y="700" width="700" height="56" rx="28" fill="#F0F4F9"/><text x="428" y="734" font-size="15" fill="#5F6368">Ask about CPT</text><circle cx="1072" cy="728" r="16" fill="#1F1F1F"/><text x="330" y="782" font-size="11" fill="#5F6368">Educational information only, not legal advice. Official sources: USCIS and Study in the States (DHS/SEVP). Confirm with your DSO.</text><text x="1260" y="788" font-size="11" fill="#80868B" text-anchor="end">Wireframe: 03-ai-fallback-answer</text></svg>